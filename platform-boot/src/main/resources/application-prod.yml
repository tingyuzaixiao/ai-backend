server:
  port: 9998    # 项目端口
  servlet:
    context-path: /admin  # 项目访问路径
spring:
  cache:
    type: redis # 缓存类型 Redis
  data:
    redis:
      host: localhost  # Redis地址
      password: redis@2026 # Redis密码，没有留空
      port: 6379  # Redis端口
  # 数据库相关配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: aircas
    password: aircas@2026
    url: jdbc:mysql://localhost:3306/platform?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&autoReconnect=false&useServerPrepStmts=true&cachePrepStmts=true&prepStmtCacheSize=250&characterEncoding=UTF-8&useLegacyDatetimeCode=false

# 本地文件系统
file:
  local:
    enable: true
    base-path: /ai/prod/imgs
    #    base-path: D:/opt/ai/imgs
    local-area-network: http://172.18.10.65:88/admin/sys-file/
    external-network: http://prod.aircas.icu:81/admin/sys-file/
  bucketName: local
  nginx-path: /nginx/Windows/nginx-1.28.0
  oss:
    enable: false
    endpoint: http://172.18.10.65:9000
    access-key: RyCThnJrcDsP8uso8uYC
    secret-key: FxvSNnKkFEpQ2jPWa1la2shcB2CGrA8wwsdfVafC

dromara:
  x-file-storage: #文件存储配置
    default-platform: huawei-obs-1 #默认使用的存储平台
    thumbnail-suffix: ".min.jpg" #缩略图后缀，例如【.min.jpg】【.png】
    #对应平台的配置写在这里，注意缩进要对齐
    minio:
      - platform: minio-1 # 存储平台标识
        enable-storage: true  # 启用存储
        access-key: RyCThnJrcDsP8uso8uYC
        secret-key: FxvSNnKkFEpQ2jPWa1la2shcB2CGrA8wwsdfVafC
        end-point: http://172.18.10.65:9000
        bucket-name: local
        domain: http://172.18.10.65:9000/test/ # 访问域名，注意“/”结尾，例如：http://minio.abc.com/abc/
        base-path: test/ # 基础路径
    local-plus:
      - platform: local-plus-1 # 存储平台标识
        enable-storage: true  #启用存储
        enable-access: true #启用访问（线上请使用 Nginx 配置，效率更高）
        domain: http://127.0.0.1:8080/local-files/ # 访问域名，例如：“http://127.0.0.1:8030/file/”，注意后面要和 path-patterns 保持一致，“/”结尾，本地存储建议使用相对路径，方便后期更换域名
        base-path: local-plus/ # 基础路径
        path-patterns: /local-files/** # 访问路径
        storage-path: D:/Temp/ # 存储路径

## 登录配置
security:
  # 登录报文加密根密钥 ，必须是16位
  encodeKey: www.aircas.ac.cn
  # 跳过验证码校验的客户端
  ignore-clients:
    - test

# 配置文件加密根密码
jasypt:
  encryptor:
    password: pig  # 加密根密码
    algorithm: PBEWithMD5AndDES  # 加密算法
    iv-generator-classname: org.jasypt.iv.NoIvGenerator # 无向量生成器

